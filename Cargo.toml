[workspace]
resolver = "3"
members = [
    "crates/waypuppet",
    "crates/waypuppet-compositor",
    "crates/waypuppet-proto",
    "crates/waypuppet-select",
]

[workspace.package]
authors = ["Nathan Moos <moosingin3space@gmail.com>"]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
waypuppet-compositor = { path = "crates/waypuppet-compositor" }
waypuppet-proto = { path = "crates/waypuppet-proto" }
waypuppet-select = { path = "crates/waypuppet-select" }

# Property testing. The selector grammar is the one part of waypuppet whose
# output is read by something that cannot ask a follow-up question, so the
# properties that matter — every rejection names a fix, a printed query parses
# back to itself, a one-character typo still suggests the role it meant — are
# worth checking over generated input rather than over examples somebody thought
# of. `arbtest` is minimal, takes a time budget rather than a case count, and
# prints a seed to replay a failure with.
arbtest = "0.3"

clap = { version = "4.6", features = ["derive", "env"] }
png = "0.18"
# `wait --title` matches a regular expression rather than a substring, which is the
# one place in waypuppet that needs an engine. It earns the dependency: titles are
# exactly where anchoring matters — `^Untitled` under substring matching would look
# for a literal caret and quietly never fire, which is the class of flake `wait`
# exists to remove.
regex = "1"
# Only for `fcntl(F_SETFL, O_NONBLOCK)` on the pipes a clipboard transfer runs over. std
# has `io::pipe` but no way to make either end non-blocking, and a blocking write on the
# compositor thread is the one thing that must never happen. Already in the tree via
# calloop and smithay, and a safe wrapper rather than a raw libc call.
rustix = { version = "1", features = ["fs"] }

# The accessibility tree arrives over AT-SPI, which is D-Bus. `atspi` is the protocol's
# own crate: its typed proxies mean the method signatures are checked rather than
# hand-written, which matters here because a mistyped one fails by returning nothing
# rather than by failing — see plan 07.
atspi = { version = "0.29", default-features = false, features = ["proxies", "tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
# The fallback bus, for images with no daemon of their own — the Flatpak SDK among them.
# Alpha, and only reached when there is no alternative; see `a11y::Provider`.
busd = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# calloop drives the compositor thread; tokio drives the control thread. They meet over
# a channel, and neither one blocks the other — see CLAUDE.md, "Two loops, one bridge".
calloop = "0.14"
futures = "0.3"
tokio = { version = "1.53", features = [
    "rt",
    "net",
    "sync",
    "process",
    "macros",
    "time",
    "io-util",
] }

# The control plane. Deadlines and cancellation come with it, the service is a Rust
# trait rather than a schema in another language, and there is no codegen step.
tarpc = { version = "0.37", features = [
    "serde1",
    "tokio1",
    "serde-transport",
    "serde-transport-bincode",
    "unix",
] }

# smithay's default features assume a compositor that owns real hardware: libinput for
# devices, libseat for the session, udev for discovery, winit and x11 for nested
# development. waypuppet has none of those — it is headless by construction and its
# input is synthetic — and neither libinput nor libseat ships in the Flatpak SDK, so the
# defaults do not even build here.
#
# The selection lives on the workspace dependency rather than in the compositor crate,
# cargo forbids a member from turning off default features the workspace left on.
[workspace.dependencies.smithay]
version = "0.7"
default-features = false
features = [
    # The wayland-server half: globals, xdg-shell, seat, output, dmabuf.
    "wayland_frontend",
    # `Space` and `Window`, so window management is not written from scratch.
    "desktop",
    # Headless EGL on a render node, and the GLES renderer that can render into an
    # offscreen buffer and copy it back to CPU memory. This is the capture path.
    "backend_egl",
    "renderer_gl",
    # gbm allocates the offscreen render target and backs `zwp_linux_dmabuf_v1`, so
    # clients that render with EGL — anything Skia-backed, which is the point — have
    # somewhere to put their buffers. Pulls `backend_drm` with it.
    "backend_gbm",
    # Lets EGL bind the wayland display (`wl_drm`), which older client stacks look for
    # before they will use hardware buffers.
    "use_system_lib",
]

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { priority = -2, level = "deny" }
pedantic = { priority = -1, level = "deny" }
mod_module_files = "deny"
allow_attributes = "deny"
