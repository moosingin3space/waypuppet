[package]
name = "waypuppet-compositor"
# `tests/fixture.rs` is a shared module, not a test binary, so the test targets
# are listed explicitly rather than discovered.
autotests = false
description = "The headless Wayland compositor that hosts and drives an application under test."
authors.workspace = true
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
waypuppet-proto.workspace = true

calloop.workspace = true
futures.workspace = true
png.workspace = true
regex.workspace = true
rustix.workspace = true
atspi.workspace = true
zbus.workspace = true
busd.workspace = true
tarpc.workspace = true
tokio.workspace = true
# Feature selection, and the reasoning behind it, lives on the workspace dependency.
smithay.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `udmabuf(7)`, for a client that has to produce a dmabuf on a machine with no GPU.
# There is no safe wrapper for the ioctl anywhere in the tree.
libc = "0.2"
# A real Wayland client, to prove the compositor from the outside. Versions
# match what smithay's `wayland-server` is paired with.
tempfile = "3"
wayland-client = "0.31"
# `unstable` is for `zwp_primary_selection_v1`, which the clipboard tests drive from the
# client side — a terminal's middle-click selection lives there rather than in core.
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }

[[test]]
name = "handshake"
path = "tests/handshake.rs"

[[test]]
name = "capture"
path = "tests/capture.rs"

[[test]]
name = "control"
path = "tests/control.rs"

[[test]]
name = "stall"
path = "tests/stall.rs"

[[test]]
name = "input"
path = "tests/input.rs"

[[test]]
name = "dmabuf"
path = "tests/dmabuf.rs"

[[test]]
name = "frames"
path = "tests/frames.rs"

[[test]]
name = "wait"
path = "tests/wait.rs"

[[test]]
name = "clipboard"
path = "tests/clipboard.rs"

[[test]]
name = "resize"
path = "tests/resize.rs"

[[test]]
name = "tree"
path = "tests/tree.rs"
