[package]
name = "waypuppet-compositor"
description = "The headless Wayland compositor that hosts and drives an application under test."
authors.workspace = true
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
waypuppet-proto.workspace = true

calloop.workspace = true
# Feature selection, and the reasoning behind it, lives on the workspace dependency.
smithay.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# A real Wayland client, to prove the compositor from the outside. Versions
# match what smithay's `wayland-server` is paired with.
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
